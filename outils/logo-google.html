<!doctype html>

  html, body { margin: 0; width: 720px; height: 720px; overflow: hidden; background: radial-gradient(70% 70% at 70% 25%, #2A1F4A 0%, #17150F 70%); }

</style>
</head>

  <svg viewBox="0 0 28 28"><path d="M19 8.5H9.5v11H19M9.5 14h7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.25 0)"/><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5B3FE0"/><stop offset="1" stop-color="#C93BE6"/></linearGradient></defs><circle cx="20.5" cy="7.5" r="2.4" fill="url(#g)"/></svg>

</html>
