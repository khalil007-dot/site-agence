<!doctype html>
<!-- Couverture de la fiche Google Business (1600 × 900). Régénérer avec : bash outils/og-image.sh
     Google recadre la couverture selon l'écran : tout l'important reste au centre, peu de texte, pas de prix. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Mona Sans"; font-weight: 200 900; src: url("../public/fonts/mona-sans-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body { background: #F6F5F1; font-family: "Mona Sans", sans-serif; color: #17150F; position: relative; }
  .halo { position: absolute; border-radius: 50%; filter: blur(90px); }
  .halo.a { left: 380px; top: 120px; width: 560px; height: 560px; background: rgba(91,63,224,.30); }
  .halo.b { left: 720px; top: 220px; width: 560px; height: 560px; background: rgba(201,59,230,.24); }
  .brand { position: absolute; left: 0; right: 0; top: 54px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .brand svg { width: 46px; height: 46px; }
  .win { position: absolute; width: 760px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px rgba(23,21,15,.22), 0 0 0 1px rgba(23,21,15,.08); }
  .win .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #ECEAE4; }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #DCD8CF; }
  .win img { display: block; width: 100%; }
  .w1 { left: 180px; top: 190px; transform: rotate(-3deg); }
  .w2 { left: 500px; top: 300px; transform: rotate(2deg); }
  .phone { position: absolute; left: 1200px; top: 230px; width: 230px; height: 470px; border-radius: 38px; background: #17150F; padding: 10px; box-sizing: border-box; box-shadow: 0 30px 70px rgba(23,21,15,.3); transform: rotate(5deg); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; border-radius: 29px; display: block; }
</style>
</head>
<body>
  <div class="halo a"></div>
  <div class="halo b"></div>
  <div class="brand"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#17150F"/><path d="M19 8.5H9.5v11H19M9.5 14h7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.5" cy="5.5" r="3" fill="#C93BE6"/></svg>Épure Studio</div>
  <div class="win w1"><div class="bar"><i></i><i></i><i></i></div><img src="../ressources/google-business/photos/01-omi-restaurant.jpg" alt=""></div>
  <div class="win w2"><div class="bar"><i></i><i></i><i></i></div><img src="../ressources/google-business/photos/02-streetsapp.jpg" alt=""></div>
  <div class="phone"><img src="../ressources/google-business/photos/01-omi-restaurant.jpg" alt=""></div>
</body>
</html>
