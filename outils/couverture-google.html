<!doctype html>
<!-- Couverture de la fiche Google Business (1600 × 900). Régénérer avec : bash outils/og-image.sh
     Un mur de sites d'exemple pour des commerces de tous les métiers (tous fictifs), le logo au centre.
     Google recadre la couverture selon l'écran : tout l'important reste au centre, pas de prix. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Mona Sans"; font-weight: 200 900; src: url("../public/fonts/mona-sans-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body { background: #E9E6F5; font-family: "Mona Sans", sans-serif; color: #17150F; position: relative; }

  .wall { position: absolute; left: 50%; top: 50%; width: 1940px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px;
    transform: translate(-50%, -50%) perspective(2400px) rotateX(18deg) rotateZ(-9deg); }
  .site { height: 250px; border-radius: 12px; overflow: hidden; background: var(--bg); box-shadow: 0 18px 40px rgba(40,20,90,.18); display: flex; flex-direction: column; }
  .site .bar { height: 22px; flex: none; display: flex; align-items: center; gap: 5px; padding: 0 10px; background: rgba(0,0,0,.06); }
  .site .bar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.18); }
  .site nav { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .site nav span { width: 28px; height: 5px; border-radius: 3px; background: currentColor; opacity: .25; }
  .site nav span:first-of-type { margin-left: auto; }
  .site .hero { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; padding: 4px 16px 16px; align-items: center; }
  .site h3 { margin: 0; font-size: 24px; line-height: 1.05; letter-spacing: -0.02em; color: var(--ink); font-family: var(--f, "Mona Sans"); font-weight: var(--w, 700); }
  .site p { margin: 8px 0 12px; font-size: 11px; color: var(--ink); opacity: .7; }
  .site .btn { display: inline-block; padding: 7px 12px; border-radius: var(--r, 6px); background: var(--acc); color: var(--on, #fff); font-size: 11px; font-weight: 700; }
  .site .img { height: 100%; min-height: 150px; border-radius: 8px; background: var(--img); display: grid; place-items: center; }
  .site .img svg { width: 58%; height: 58%; }

  .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 660px; padding: 46px 40px 40px; border-radius: 24px;
    background: rgba(255,255,255,.96); text-align: center; box-shadow: 0 40px 100px rgba(40,20,90,.35), 0 0 0 1px rgba(23,21,15,.06); }
  .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; border-radius: 24px 24px 0 0; background: linear-gradient(120deg, #5B3FE0, #9A3DE8 55%, #C93BE6); }
  .brand { display: inline-flex; align-items: center; gap: 16px; font-size: 46px; font-weight: 700; letter-spacing: -0.03em; }
  .brand svg { width: 66px; height: 66px; }
  .sub { margin-top: 14px; font-size: 27px; font-weight: 600; letter-spacing: -0.015em; }
  .sub em { font-style: normal; background: linear-gradient(transparent 60%, #D4C8FF 60%, #D4C8FF 94%, transparent 94%); }
  .trades { margin-top: 12px; font-size: 19px; color: #5C584E; font-weight: 500; }
</style>
</head>
<body>
  <div class="wall" id="wall"></div>

  <div class="card">
    <div class="brand"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#17150F"/><path d="M19 8.5H9.5v11H19M9.5 14h7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21.5" cy="5.5" r="3" fill="#C93BE6"/></svg>Épure Studio</div>
    <div class="sub"><em>Agence de création de sites web</em></div>
    <div class="trades">Restaurants, commerces et indépendants · Bruxelles</div>
  </div>

<script>
  // Icônes au trait, 24 × 24
  const I = {
    pain: '<path d="M3 15c-1-5 4-9 9-9s10 4 9 9c-.4 3-4 4-9 4s-8.6-1-9-4z"/><path d="M8 9q2 3 1 7M12 8q2 3 1 8M16 9q2 3 1 7"/>',
    ciseaux: '<circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16 19 3M16 16 5 3"/>',
    goutte: '<path d="M12 3s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/><path d="M9 15a3 3 0 0 0 3 3"/>',
    couverts: '<path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2 1-3 4-3 8h3"/>',
    fleur: '<circle cx="12" cy="9" r="2.5"/><path d="M12 6.5a3 3 0 1 1 2.4 1.2M14.4 9a3 3 0 1 1-1.2 2.4M12 11.5a3 3 0 1 1-2.4-1.2M9.6 9a3 3 0 1 1 1.2-2.4M12 12v9M12 17c-2-2-5-2-5-2s1 3 5 3"/>',
    voiture: '<path d="M3 16v-3l2-5h14l2 5v3z"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/><path d="M5 12h14"/>',
    dent: '<path d="M7 3c-3 0-4 3-3 6 .7 2 1 4 1.5 7S7 21 8 21s1.5-6 4-6 3 6 4 6 2-2 2.5-5 .8-5 1.5-7c1-3 0-6-3-6-2 0-3 1-5 1S9 3 7 3z"/>',
    sac: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    haltere: '<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
    tasse: '<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 2v3M12 2v3"/>',
    balance: '<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
    eclair: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    pizza: '<path d="M12 21 3 6c6-3 12-3 18 0z"/><circle cx="10" cy="9" r="1.2"/><circle cx="14" cy="12" r="1.2"/><circle cx="11" cy="15" r="1.2"/>',
    maison: '<path d="M3 11 12 4l9 7M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    patte: '<circle cx="7" cy="9" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="9" r="2"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5-2 3-4 3-4 0-4-3z"/>',
  };
  // Métiers fictifs : nom, titre, bouton, icône, fond, texte, accent, fond de l'image, police, graisse, texte du bouton, arrondi du bouton
  const S = [
    ['Le Fournil', 'Le bon pain du quartier', 'Commander', 'pain', '#F6EBDD', '#3B2414', '#8B4A23', '#E8CFA8', 'Georgia, serif', 400],
    ['Salon Mila', 'Coiffure & barbier', 'Prendre rendez-vous', 'ciseaux', '#151515', '#fff', '#F2A7C3', '#2A2A2A', null, 700, '#151515', '99px'],
    ['Dépanno Plomberie', 'Fuite ? On arrive en 1 h', 'Appeler', 'goutte', '#EAF2FB', '#0E2A47', '#F26B1D', '#CFE2F6'],
    ['Trattoria Nonna', 'Pâtes fraîches maison', 'Réserver', 'couverts', '#F3EFE3', '#1E3A2B', '#1E5B3A', '#DCE8D5', 'Georgia, serif', 400],
    ['Atelier Pétale', 'Fleurs pour chaque moment', 'Commander', 'fleur', '#FBEFF1', '#4A2330', '#C24D6E', '#F6D5DD', 'Georgia, serif', 400, null, '99px'],
    ['Garage du Centre', 'Entretien toutes marques', 'Devis gratuit', 'voiture', '#1B1E24', '#fff', '#FFC93C', '#2B3039', null, 800, '#1B1E24'],
    ['Cabinet Sourire', 'Votre dentiste à deux pas', 'Prendre RDV', 'dent', '#F2F8F8', '#123B3E', '#1F8A8A', '#D4ECEC'],
    ['Maison Lin', 'Nouvelle collection', 'Découvrir', 'sac', '#EFE9E1', '#1A1A1A', '#1A1A1A', '#DDD3C6', 'Georgia, serif', 400, null, '0'],
    ['Studio Forme', 'Votre séance d\'essai offerte', 'Réserver', 'haltere', '#101010', '#fff', '#C6F432', '#222', null, 800, '#101010', '99px'],
    ['Café des Arts', 'Brunch tous les jours', 'Voir la carte', 'tasse', '#FFF4E3', '#3A2A1A', '#D9822B', '#F7DDB8', 'Georgia, serif', 400],
    ['Cabinet Delvaux', 'Avocats en droit des affaires', 'Nous contacter', 'balance', '#F4F3EF', '#1C2541', '#1C2541', '#DADCE6', 'Georgia, serif', 400],
    ['Élec Express', 'Électricien agréé', 'Appeler', 'eclair', '#FFFBEA', '#2B2300', '#2B2300', '#FFE680', null, 800, '#FFE680'],
    ['Pizza Forno', 'Cuite au feu de bois', 'Commander', 'pizza', '#FFF0EA', '#4A1608', '#D7361B', '#FBD3C4', null, 800, null, '99px'],
    ['Immo Horizon', 'Vendre au juste prix', 'Estimer mon bien', 'maison', '#EEF1F8', '#162447', '#3557C9', '#D6DEF3'],
    ['Toilettage Câlin', 'Le salon de vos compagnons', 'Prendre RDV', 'patte', '#F5F0FF', '#2E1B5C', '#7A4FE0', '#E2D8FB', null, 700, null, '99px'],
  ];
  const wall = document.getElementById('wall');
  for (let k = 0; k < 25; k++) {
    const [nom, titre, btn, ico, bg, ink, acc, img, f, w, on, r] = S[k % S.length];
    const d = document.createElement('div');
    d.className = 'site';
    d.style.cssText = `--bg:${bg};--ink:${ink};--acc:${acc};--img:${img};--w:${w || 700};${f ? `--f:${f};` : ''}${on ? `--on:${on};` : ''}${r ? `--r:${r};` : ''}`;
    d.innerHTML = `<div class="bar"><i></i><i></i><i></i></div>
      <nav>${nom}<span></span><span></span><span></span></nav>
      <div class="hero"><div><h3>${titre}</h3><p>Bruxelles · ouvert aujourd'hui</p><span class="btn">${btn}</span></div>
      <div class="img"><svg viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${I[ico]}</svg></div></div>`;
    wall.appendChild(d);
  }
</script>
</body>
</html>
